# main 에 합쳐지면 자동 배포한다.
#   ① 린트 · 안전망 테스트 → ② 앱·랜딩을 Cloudflare 에 올린다 → ③ 운영 주소에서 다시 테스트
# 테스트가 실패하면 올리지 않는다.
#
# ★ 2026-09-25. 예전에는 「직전 커밋 대비 바뀐 곳만」 올렸다. PR 셋을 연달아 합치자
#   GitHub 가 기다리던 배포를 취소하고 마지막 것만 남겼는데, 마지막 것은 문서만 바뀌어
#   앱을 안 올렸다 — 가운데 PR 의 계산 수정이 운영에 빠졌다.
#   이제는 매번 최신 main 을 통째로 올린다. 앞 배포가 취소돼도 마지막 배포가 전부 싣는다.
#
# 필요한 비밀 값 (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN — 만드는 법은 docs/deploy.md
name: 자동 배포

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 화면에서 손으로 다시 돌릴 수 있게

concurrency:
  group: deploy # 배포가 겹치지 않게 한 번에 하나씩
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 38950986f7a45785abaee1821078b111

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ★ Q-2 (2026-09-27). 린트 · 타입 검사도 통과해야 올린다 — 예전에는 npm test 만 보고 배포했다
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy-app:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 운영 주소가 내주는 파일이 저장소와 한 바이트도 다르지 않은지
      - run: node tools/verify-deploy.mjs
      # 운영 주소에서 한 번 더 — 올라간 것이 테스트한 것과 같은지
      - run: npx playwright install --with-deps chromium
      - run: npm run test:prod
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: prod-test-results
          path: test-results/
          retention-days: 7

  deploy-landing:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run deploy:landing -- --commit-hash=${{ github.sha }} --commit-message="$(git log -1 --pretty=%s)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: 랜딩이 앱 주소를 가리키는지
        run: curl -fsS https://namneundon.com/ | grep -q "APP_URL   = 'https://app.namneundon.com'"
