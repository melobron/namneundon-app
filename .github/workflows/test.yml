# PR 과 main 에 올라올 때마다 안전망 테스트를 돌린다.
# 화면 글자나 계산 숫자가 한 글자라도 바뀌면 빨간불이 켜진다.
name: 안전망 테스트

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: node tools/check-load-order.mjs
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
