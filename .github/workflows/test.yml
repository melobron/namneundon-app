# PR 과 main 에 올라올 때마다 안전망 테스트를 돌린다.
# 화면 글자나 계산 숫자가 한 글자라도 바뀌면 빨간불이 켜진다.
name: 안전망 테스트

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run check
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # 기본 설치 Python 과 무관하게 공식 자동 설치 경로도 실제 Windows 에서 확인한다.
      - run: node --input-type=module -e "import { installWindowsPython } from './tools/setup-python.mjs'; await installWindowsPython();"
      - run: npm.cmd run setup
      - run: npm.cmd run doctor
      - run: npm.cmd run analysis:check
      - run: npm.cmd run lint
      - run: npm.cmd test -- --workers=2
