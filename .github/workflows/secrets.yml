# 비밀 값 유출 검사 — 토큰·비밀번호·키가 커밋되면 빨간불.
# GitHub 의 secret scanning 은 비공개 저장소에서 유료라, 무료 도구 gitleaks 를 쓴다.
name: 비밀 값 검사

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # 기록 전체를 본다
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
