body{min-height:100vh;background:linear-gradient(180deg,#FFFDFB 0%,#F7F3EE 100%);
     color:var(--ink);font-family:var(--body);line-height:1.62;word-break:keep-all;
     -webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:28px}
.box{text-align:center;max-width:30em}
.mark{width:64px;height:64px;margin:0 auto 22px;display:block}
h1{font-family:var(--title);font-weight:400;font-size:clamp(25px,5vw,34px);line-height:1.4}
p{margin-top:14px;font-size:16px;color:#57504A}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 24px;
     margin-top:28px;border-radius:var(--rad-pill);background:var(--good);color:#fff;
     font-size:16px;font-weight:700;text-decoration:none;
     box-shadow:0 2px 12px rgba(44,128,85,.28);transition:transform .12s ease}
.btn:active{transform:translateY(1px)}
</style>
</head>
<body>
  <div class="box">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="10" y="14" width="80" height="62" rx="22" fill="#2C8055"/>
      <path d="M26 72 L24 90 L42 74 Z" fill="#2C8055"/>
      <circle cx="50" cy="45" r="20" fill="#F1F7F3"/>
      <circle cx="50" cy="45" r="13" fill="none" stroke="#CFE3D8" stroke-width="2.6"/>
      <circle cx="44.5" cy="42" r="2.8" fill="#23201E"/>
      <circle cx="55.5" cy="42" r="2.8" fill="#23201E"/>
      <path d="M43.5 49 Q50 55 56.5 49" stroke="#23201E" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M76 20 L79 27 M83 16 L84 24" stroke="#8fd0ae" stroke-width="3.4" stroke-linecap="round"/>
    </svg>
    <h1>이 주소에는 페이지가 없습니다</h1>
    <p>주소를 잘못 누르셨거나, 없어진 주소일 수 있습니다.</p>
    <a class="btn" href="/">첫 화면으로</a>
  </div>
</body>
</html>
